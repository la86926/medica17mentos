<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Mi tratamiento</title>
<meta name="description" content="Organiza tus medicamentos: horario de tomas, recordatorios en tu calendario y sincronización con tu ID.">
<meta name="theme-color" content="#fbfcfd" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1418" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tratamiento">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="icon" href="favicon.ico?v=1.8" sizes="any">
<link rel="icon" href="favicon-32.png?v=1.8" type="image/png" sizes="32x32">
<link rel="icon" href="favicon-16.png?v=1.8" type="image/png" sizes="16x16">
<link rel="apple-touch-icon" href="logo-180.png?v=1.8" sizes="180x180">
<link rel="manifest" href="manifest.webmanifest?v=1.8">
<meta property="og:title" content="Mi tratamiento">
<meta property="og:description" content="Organiza tus medicamentos y tus tomas, y sincronízalos con tu ID.">
<meta property="og:image" content="https://la86926.github.io/medica17mentos/logo-512.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}

/* Layout: a quiet column — header with two views (Horario, Medicamentos); strip of days, the selected day's times, end dates */
:root{
  --bg:#fbfcfd; --fg:#16202a; --muted:#8a97a4; --faint:#e7ecf0;
  --sel:#16202a; --selfg:#ffffff;
  --m0:#2f8f6b; --m1:#d08a1c; --m2:#7656b8; --m3:#3f7fd6; --m4:#cf5a83; --m5:#2a9aa6; --d:#c27c12; --blue:#2f6fdb; --red:#e5483f; --card:#ffffff;
  --font:"Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1418; --fg:#e8eef3; --muted:#7f8e9b; --faint:#232d36; --sel:#e8eef3; --selfg:#0f1418;
  --m0:#5fd0a3; --m1:#f0b24f; --m2:#b49af0; --m3:#7fb0f5; --m4:#f08fb1; --m5:#66d2dc; --d:#f0b24f; --blue:#3d7ef0; --red:#ff5a50; --card:#1d262e; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1418; --fg:#e8eef3; --muted:#7f8e9b; --faint:#232d36; --sel:#e8eef3; --selfg:#0f1418;
  --m0:#5fd0a3; --m1:#f0b24f; --m2:#b49af0; --m3:#7fb0f5; --m4:#f08fb1; --m5:#66d2dc; --d:#f0b24f; --blue:#3d7ef0; --red:#ff5a50; --card:#1d262e; color-scheme:dark}
html,body{touch-action:manipulation;-webkit-text-size-adjust:100%}
html{background:var(--bg)}
/* the strip under the clock and notifications always has the page color, so the browser bar matches the app */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:43;pointer-events:none}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:16px;line-height:1.4;
  padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
.wrap{max-width:520px;margin:0 auto;padding-block:40px 64px;display:flex;flex-direction:column;gap:40px}
header h1{margin:0;font-size:28px;font-weight:800;letter-spacing:-.025em}
header p{margin:6px 0 0;color:var(--muted);font-size:14px;font-weight:500}

.strip{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-inline:-4px;padding:22px 4px 4px;scroll-snap-type:x proximity}
.strip::-webkit-scrollbar{display:none}
.day{flex:none;width:44px;display:flex;flex-direction:column;align-items:center;gap:6px;border:0;background:none;color:var(--fg);
  font-family:var(--font);cursor:pointer;padding:0;position:relative;scroll-snap-align:center}
.day .w{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.day .n{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:16px;font-weight:700;font-variant-numeric:tabular-nums}
.day .m{position:absolute;top:-20px;left:4px;font-size:11px;font-weight:700;color:var(--fg);letter-spacing:.04em}
.day .s{width:6px;height:6px;border-radius:50%;background:transparent}
.day.part .s{border:1.5px solid var(--muted)}
.day.full .s{background:var(--fg)}
.day.today .n{box-shadow:inset 0 0 0 1.5px var(--fg)}
.day[aria-selected="true"] .n{background:var(--sel);color:var(--selfg);box-shadow:none}

.drow{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 -16px}
.dtitle{font-size:14px;color:var(--muted);font-weight:600;margin:0}
.cal{display:inline-flex;align-items:center;gap:6px;border:0;background:none;color:var(--muted);font:600 13px var(--font);padding:6px 0;cursor:pointer}
.ciw{position:relative;display:inline-block;flex:none}
.ci{width:24px;height:26px;border-radius:6px;background:var(--card);box-shadow:0 0 0 1px var(--faint),0 1px 3px rgba(0,0,0,.12);overflow:hidden;display:flex;flex-direction:column}
.ci-top{height:7px;background:var(--red);flex:none}
.ci-n{flex:1;display:grid;place-items:center;font:800 12px/1 var(--font);color:var(--fg);font-variant-numeric:tabular-nums}
.ci-plus{position:absolute;right:-6px;bottom:-6px;width:15px;height:15px;border-radius:50%;background:var(--blue);box-shadow:0 0 0 2px var(--bg);display:grid;place-items:center}
.ci-plus svg{width:9px;height:9px}
.cal span.lbl{color:var(--fg)}
.cal:hover,.cal:focus-visible{color:var(--fg)}
.cal:focus-visible{outline:2px solid var(--fg);outline-offset:3px;border-radius:6px}
.tc{display:flex;flex-direction:column;align-items:flex-start;gap:2px}
.tc .cal{padding:4px 0}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);font-size:13px;font-weight:600;padding:9px 14px;border-radius:999px;z-index:50;max-width:calc(100% - 40px);text-align:center}
.times{display:flex;flex-direction:column;gap:32px}
.time{display:grid;grid-template-columns:96px 1fr;gap:12px;align-items:start}
.time .t{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;padding-top:12px;color:var(--muted);position:relative}
.time .t .sub{display:block;font-size:11px;font-weight:600;margin-top:2px}
.time .t.ed{color:var(--fg);cursor:pointer}
.time .t.ed .ap{font-size:12px;font-weight:700;margin-left:3px}
.time .t.ed .v{border-bottom:1.5px dashed var(--muted);padding-bottom:1px}
.time .t.ed svg{width:12px;height:12px;margin-left:4px;vertical-align:-1px;stroke:var(--muted)}
button.t{border:0;background:none;font-family:var(--font);text-align:left;margin:0}
.sheet-bg{position:fixed;inset:0;background:rgba(10,15,20,.38);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:520px;box-sizing:border-box;background:var(--bg);border-radius:22px 22px 0 0;display:flex;flex-direction:column;gap:14px;
  padding:14px max(20px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.sh-top{display:flex;justify-content:space-between;align-items:center}
.sh-x{border:0;background:none;color:var(--muted);font:600 15px var(--font);padding:8px 0;cursor:pointer}
.sh-ok{width:46px;height:46px;border-radius:50%;border:0;background:var(--blue);display:grid;place-items:center;cursor:pointer}
.sh-ok svg{width:20px;height:20px}
.wheels{position:relative;display:flex;justify-content:center;align-items:center;gap:6px;height:220px}
.band{position:absolute;left:0;right:0;top:88px;height:44px;border-radius:12px;background:var(--faint)}
.wheel{position:relative;height:220px;width:72px;box-sizing:border-box;overflow-y:auto;scroll-snap-type:y mandatory;scrollbar-width:none;padding-block:88px;
  overscroll-behavior:contain;-webkit-overflow-scrolling:touch;-webkit-mask-image:linear-gradient(transparent,#000 30%,#000 70%,transparent);mask-image:linear-gradient(transparent,#000 30%,#000 70%,transparent)}
.wheel::-webkit-scrollbar{display:none}
.wheel div{height:44px;display:grid;place-items:center;font:700 26px var(--font);font-variant-numeric:tabular-nums;scroll-snap-align:center;color:var(--muted)}
.wheel div.cur{color:var(--fg)}
.colon{position:relative;font:700 26px var(--font)}
.sh-prev{margin:0;text-align:center;font-size:14px;color:var(--muted);min-height:20px;font-variant-numeric:tabular-nums}
.sh-ok:focus-visible,.sh-x:focus-visible,button.t:focus-visible{outline:2px solid var(--fg);outline-offset:3px}
.warn{margin:6px 0 0;font-size:13px;color:var(--d);font-weight:600}
.items{display:flex;flex-direction:column;min-width:0}
.it{display:flex;align-items:center;gap:14px;width:100%;border:0;background:none;color:var(--fg);font:600 17px var(--font);
  padding:10px 0;cursor:pointer;text-align:left}
.it .b{width:26px;height:26px;border-radius:50%;border:2px solid var(--c);flex:none;display:grid;place-items:center;transition:background .15s}
.it .b svg{width:14px;height:14px;opacity:0;transition:opacity .15s}
.it.on .b{background:var(--c)}
.it.on .b svg{opacity:1}
.it.on .l{color:var(--muted);text-decoration:line-through;text-decoration-thickness:1.5px}
.it:focus-visible,.day:focus-visible{outline:2px solid var(--fg);outline-offset:3px;border-radius:12px}

.hint{margin:6px 0 0;font-size:13px;color:var(--muted);font-weight:500}
.ends{display:flex;flex-direction:column;gap:12px;padding-top:28px;border-top:1px solid var(--faint)}
.end{display:flex;align-items:center;gap:10px;font-size:14px}
.end i{width:8px;height:8px;border-radius:50%;flex:none}
.end span{margin-left:auto;color:var(--muted);font-variant-numeric:tabular-nums}

.hand{position:absolute;z-index:20;pointer-events:none;display:flex;flex-direction:column;align-items:center;gap:6px}
.hand svg{width:38px;height:38px;animation:tap 1.2s ease-in-out infinite;filter:drop-shadow(0 2px 4px rgba(0,0,0,.25))}
.hand span{background:var(--fg);color:var(--bg);font-size:12px;font-weight:700;padding:5px 11px;border-radius:999px;white-space:nowrap}
@keyframes tap{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px) scale(.94)}}
@media (prefers-reduced-motion:reduce){.hand svg{animation:none}}

.hrow{display:flex;align-items:center;gap:10px}
.logo{width:30px;height:30px;flex:none;color:var(--fg)}
.logo svg{width:100%;height:100%;display:block}
.logo path{fill:currentColor}
.top{display:flex;align-items:center;gap:10px;margin-left:-8px}
.mbtn{width:42px;height:42px;border:0;background:none;border-radius:50%;display:grid;place-items:center;cursor:pointer;color:var(--fg);flex:none}
.mbtn svg{width:22px;height:22px;stroke:currentColor}
.mbtn:focus-visible{outline:2px solid var(--fg)}
.scrim{position:fixed;inset:0;background:rgba(10,15,20,.32);z-index:44}
.menu{position:fixed;top:0;bottom:0;left:0;width:min(280px,82vw);box-sizing:border-box;background:var(--bg);z-index:45;display:flex;flex-direction:column;gap:22px;
  transform:translateX(-105%);visibility:hidden;transition:transform .25s ease,visibility 0s linear .25s;border-right:1px solid var(--faint);
  padding:calc(26px + env(safe-area-inset-top,0px)) 14px calc(20px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px))}
.menu.open{transform:none;visibility:visible;transition:transform .25s ease,visibility 0s;box-shadow:8px 0 30px rgba(0,0,0,.12)}
.mhead{display:flex;align-items:center;gap:10px;padding:0 10px}
.mhead b{font-size:17px;font-weight:800;letter-spacing:-.015em}
.mhead .logo{width:26px;height:26px}
.mnav{display:flex;flex-direction:column;gap:2px}
.mnav button{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;color:var(--fg);font:600 16px var(--font);padding:12px 10px;border-radius:12px;cursor:pointer;text-align:left}
.mnav button svg{width:20px;height:20px;stroke:currentColor;flex:none;color:var(--muted)}
.mnav button[aria-current="page"]{background:var(--faint)}
.mnav button[aria-current="page"] svg{color:var(--fg)}
.mnav button:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.mnav .dot{width:7px;height:7px;border-radius:50%;background:var(--m0);margin-left:auto}
.mv{font-size:12px;font-weight:600;color:var(--muted);opacity:.8;align-self:flex-end;margin-bottom:2px;font-variant-numeric:tabular-nums}
@media (min-width:960px){
  .menu{transform:none;transition:none;visibility:visible}
  .menu.open{box-shadow:none}
  .mbtn,.scrim{display:none!important}
  .top{margin-left:0}
  body{padding-left:calc(280px + 32px)}
}
@media (prefers-reduced-motion:reduce){.menu{transition:none}}
.idbox{display:flex;flex-direction:column;gap:14px}
.lead{margin:0;font-size:16px;color:var(--muted);line-height:1.5;max-width:42ch}
.idform{display:flex;gap:8px}
.idform input{flex:1;min-width:0;font:600 17px var(--font);color:var(--fg);background:var(--card);border:1.5px solid var(--faint);border-radius:12px;padding:11px 12px;letter-spacing:.04em;user-select:text;-webkit-user-select:text}
.idform input:focus{outline:none;border-color:var(--blue)}
.idform .btn{padding:0 18px}
.lnk{border:0;background:none;color:var(--blue);font:600 15px var(--font);padding:6px 0;cursor:pointer;align-self:flex-start}
.lnk:focus-visible{outline:2px solid var(--fg);outline-offset:3px}
.lnk.out{color:var(--red);margin-top:12px}
.lbl2{margin:0;font-size:13px;font-weight:700;color:var(--muted)}
.idrow{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.code{font:800 28px var(--font);letter-spacing:.06em;user-select:text;-webkit-user-select:text;word-break:break-all;min-width:0}
.st{margin:0;font-size:14px;color:var(--muted)}
.st.ok{color:var(--m0)}
.st.bad{color:var(--d)}
.note{margin:0;font-size:13px;color:var(--muted)}
.btn:disabled{opacity:.5;cursor:default}
.it .l small{display:block;font-size:13px;font-weight:500;color:var(--muted);text-decoration:none;margin-top:1px}
.empty{display:flex;flex-direction:column;align-items:flex-start;gap:14px;padding-block:8px}
.empty p{margin:0;color:var(--muted);font-size:15px}
.btn{border:0;background:var(--blue);color:#fff;font:700 15px var(--font);padding:12px 18px;border-radius:12px;cursor:pointer}
.btn:focus-visible{outline:2px solid var(--fg);outline-offset:3px}
.mlist{display:flex;flex-direction:column}
.mrow{display:flex;align-items:center;gap:14px;width:100%;border:0;border-bottom:1px solid var(--faint);background:none;color:var(--fg);text-align:left;padding:16px 0;cursor:pointer;font-family:var(--font)}
.mrow i{width:12px;height:12px;border-radius:50%;flex:none}
.mrow .tx{flex:1;min-width:0}
.mrow b{display:block;font-size:17px;font-weight:700}
.vh{display:flex;flex-direction:column;gap:40px;min-width:0}
.mrow .sub{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.mrow svg{width:14px;height:14px;stroke:var(--muted);flex:none}
.mrow:focus-visible{outline:2px solid var(--fg);outline-offset:2px;border-radius:8px}
.add{display:flex;align-items:center;gap:10px;border:0;background:none;color:var(--blue);font:700 16px var(--font);padding:18px 0;cursor:pointer}
.add .pl{width:26px;height:26px;border-radius:50%;background:var(--blue);display:grid;place-items:center}
.add .pl svg{width:12px;height:12px}
.fm{display:flex;flex-direction:column;gap:18px}
.fm h2{margin:0;font-size:19px;font-weight:800;letter-spacing:-.015em}
.fl{display:flex;flex-direction:column;gap:8px}
.fl>span{font-size:13px;font-weight:700;color:var(--muted)}
.fm input[type=text],.fm input[type=date]{font:600 17px var(--font);color:var(--fg);background:var(--card);border:1.5px solid var(--faint);border-radius:12px;padding:11px 12px;width:100%;box-sizing:border-box;min-height:46px;-webkit-appearance:none;appearance:none;user-select:text;-webkit-user-select:text}
.fm input:focus{outline:none;border-color:var(--blue)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{border:1.5px solid var(--faint);background:var(--card);color:var(--fg);font:700 15px var(--font);padding:9px 14px;border-radius:999px;cursor:pointer;font-variant-numeric:tabular-nums}
.chips button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.step{display:flex;align-items:center;gap:14px}
.step button{width:42px;height:42px;border-radius:50%;border:1.5px solid var(--faint);background:var(--card);color:var(--fg);font:700 20px var(--font);cursor:pointer;display:grid;place-items:center;padding:0}
.step output{font:800 20px var(--font);min-width:76px;text-align:center;font-variant-numeric:tabular-nums}
.colors{display:flex;gap:10px}
.colors button{width:30px;height:30px;border-radius:50%;border:0;cursor:pointer;box-shadow:0 0 0 2px var(--bg),0 0 0 2px transparent}
.colors button[aria-pressed="true"]{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--fg)}
.del{border:0;background:none;color:var(--red);font:700 15px var(--font);padding:6px 0;cursor:pointer;align-self:flex-start}
.ferr{margin:0;color:var(--d);font-size:13px;font-weight:600}
.sheet.tall{max-height:92vh;overflow-y:auto}
.chips button:focus-visible,.step button:focus-visible,.colors button:focus-visible,.del:focus-visible,.add:focus-visible{outline:2px solid var(--fg);outline-offset:3px}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <button class="mbtn" id="menuBtn" aria-label="Abrir menú" aria-controls="menu" aria-expanded="false"><svg viewBox="0 0 22 22" fill="none" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h14M4 11h14M4 15h14"/></svg></button>
    <h1 id="vTitle">Horario</h1>
  </header>

  <div id="vH" class="vh">
    <nav class="strip" id="strip" role="tablist" aria-label="Días del tratamiento"></nav>
    <section id="dhead">
      <div class="drow"><p class="dtitle" id="dtitle"></p><button class="cal" id="calDay" aria-label="Agregar todas las tomas del día a mi calendario"></button></div>
    </section>
    <section class="times" id="times"></section>
    <section class="ends" id="ends"></section>
  </div>

  <div id="vM" hidden>
    <section class="mlist" id="mlist"></section>
    <button class="add" id="addMed"><span class="pl"><svg viewBox="0 0 10 10" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><path d="M5 1.5v7M1.5 5h7"/></svg></span>Agregar medicamento</button>
  </div>

  <div id="vI" hidden>
    <div class="idbox" id="idOff">
      <p class="lead">Con tu ID ves tus medicamentos, horarios y tomas en todos tus dispositivos.</p>
      <form class="idform" id="idForm" autocomplete="off"><input id="idIn" type="text" inputmode="text" autocapitalize="none" autocorrect="off" spellcheck="false" maxlength="28" placeholder="Tu ID" aria-label="Tu ID"><button class="btn" type="submit" id="idGo">Entrar</button></form>
      <p class="ferr" id="idErr" role="alert"></p>
      <button class="lnk" id="idNew" type="button">Crear un ID nuevo</button>
    </div>
    <div class="idbox" id="idOn" hidden>
      <p class="lbl2">Tu ID</p>
      <div class="idrow"><div class="code" id="idCode"></div><button class="lnk" id="idCopy" type="button">Copiar</button></div>
      <p class="st" id="idState"></p>
      <p class="note">Quien tenga tu ID puede ver tus tomas. No lo compartas.</p>
      <button class="lnk" id="idRen" type="button">Cambiar ID</button>
      <form class="idform" id="renForm" autocomplete="off" hidden><input id="renIn" type="text" autocapitalize="none" autocorrect="off" spellcheck="false" maxlength="28" placeholder="Nuevo ID" aria-label="Nuevo ID"><button class="btn" type="submit" id="renGo">Guardar</button></form>
      <p class="ferr" id="renErr" role="alert"></p>
      <button class="lnk out" id="idOut" type="button">Cerrar sesión en este dispositivo</button>
    </div>
  </div>
</div>

<div class="scrim" id="scrim" hidden></div>
<aside class="menu" id="menu" aria-label="Menú">

    <button data-view="mi-id"><svg viewBox="0 0 20 20" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="10" cy="7" r="3.3"/><path d="M3.8 17c.8-3.2 3.3-5 6.2-5s5.4 1.8 6.2 5"/></svg>Mi ID<i class="dot" id="idDot" hidden></i></button>

<div class="sheet-bg" id="medBg" hidden>
  <div class="sheet tall" role="dialog" aria-modal="true" aria-labelledby="fmTitle">
    <div class="sh-top"><button class="sh-x" id="fmCancel">Cancelar</button>
      <button class="sh-ok" id="fmOk" aria-label="Guardar"><svg viewBox="0 0 14 14" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7.3l2.6 2.6L11 4.4"/></svg></button></div>
    <form class="fm" id="fm" autocomplete="off">
      <h2 id="fmTitle">Nuevo medicamento</h2>
      <label class="fl"><span>Nombre</span><input type="text" id="fmName" maxlength="40" placeholder="Ej.: Paracetamol 500 mg"></label>
      <div class="fl"><span>Cada</span><div class="chips" id="fmEvery"></div></div>
      <div class="fl"><span>Durante</span><div class="step"><button type="button" id="dMinus" aria-label="Menos días">−</button><output id="fmDays">7 días</output><button type="button" id="dPlus" aria-label="Más días">+</button></div></div>
      <label class="fl"><span>Empieza</span><input type="date" id="fmStart"></label>
      <label class="fl"><span>Nota (opcional)</span><input type="text" id="fmNote" maxlength="40" placeholder="Ej.: con comida"></label>
      <div class="fl"><span>Color</span><div class="colors" id="fmCol"></div></div>
      <p class="ferr" id="fmErr" role="alert"></p>
      <button type="button" class="del" id="fmDel" hidden>Eliminar medicamento</button>
    </form>
  </div>
</div>

<div class="sheet-bg" id="sheetBg" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-label="Cambiar hora">
    <div class="sh-top"><button class="sh-x" id="shCancel">Cancelar</button>
      <button class="sh-ok" id="shOk" aria-label="Listo"><svg viewBox="0 0 14 14" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7.3l2.6 2.6L11 4.4"/></svg></button></div>
    <div class="wheels"><div class="band"></div><div class="wheel" id="wH"></div><span class="colon">:</span><div class="wheel" id="wM"></div><div class="wheel" id="wA"></div></div>
    <p class="sh-prev" id="shPrev"></p>
  </div>
</div>

<script>
const DIAS=["Dom","Lun","Mar","Mié","Jue","Vie","Sáb"];
const DIASL=["Domingo","Lunes","Martes","Miércoles","Jueves","Viernes","Sábado"];
const MESES=["ene","feb","mar","abr","may","jun","jul","ago","set","oct","nov","dic"];
const MESESL=["enero","febrero","marzo","abril","mayo","junio","julio","agosto","setiembre","octubre","noviembre","diciembre"];
const COLORS=["--m0","--m1","--m2","--m3","--m4","--m5"];
const EVERY=[24,12,8,6,4];
const DEFAULT_START=480; // 8:00 AM
const iso=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const parseISO=s=>{const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const addD=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const dayDiff=(a,b)=>Math.round((b-a)/864e5);
const CHECK='<svg viewBox="0 0 14 14" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7.3l2.6 2.6L11 4.4"/></svg>';
const PEN='<svg viewBox="0 0 12 12" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M8.2 1.8l2 2L4 10H2V8z"/></svg>';
const CHEV='<svg viewBox="0 0 14 14" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 2.5L9.5 7 5 11.5"/></svg>';
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

const toMin=s=>{const [h,m]=s.split(":").map(Number);return h*60+m};
const toHH=m=>{const r=((m%1440)+1440)%1440;return String(Math.floor(r/60)).padStart(2,"0")+":"+String(r%60).padStart(2,"0")};
const fmtMin=m=>{const r=((m%1440)+1440)%1440;return Math.floor(r/60)+":"+String(r%60).padStart(2,"0")};
function p12(m){const r=((m%1440)+1440)%1440,h=Math.floor(r/60);return{t:(h%12||12)+":"+String(r%60).padStart(2,"0"),ap:h<12?"AM":"PM"}}
const fmt12=m=>{const p=p12(m);return p.t+" "+p.ap};
const nextDayLbl=m=>m>=1440?((m-1440)<360?"madrugada":"día siguiente"):"";
const fmtDate=d=>DIAS[d.getDay()].toLowerCase()+" "+d.getDate()+" "+MESES[d.getMonth()];

// ---------- state ----------
// only used to keep the data of people who used the first version
const LEGACY_MEDS=[
  {id:"a",n:"Coxtor 120 mg",every:24,days:10,start:"2026-10-28",note:"",col:0},
  {id:"d",n:"Deflazym 6 mg",every:8,days:5,start:"2026-10-28",note:"",col:1},
  {id:"k",n:"Cledium 300 mg",every:24,days:30,start:"2026-10-28",note:"Con comida",col:2}
];
let state={meds:[],c:{},t:{},tf:{},v:2};
function load(s){
  const o={meds:Array.isArray(s&&s.meds)?s.meds.map(m=>Object.assign({},m)):(s&&(s.c&&Object.keys(s.c).length||s.t&&Object.keys(s.t).length)?LEGACY_MEDS.map(m=>Object.assign({},m)):[]),
    c:Object.assign({},s&&s.c),t:Object.assign({},s&&s.t),tf:Object.assign({},s&&s.tf),v:2};
  if(!(s&&s.v===2)){ // move older records to the new format
    const SL={"0700":0,"1500":1,"2300":2},c={};
    for(const k in o.c){const m=k.match(/^(\d{4}-\d\d-\d\d)\|(0700|1500|2300)\|([a-z0-9]+)$/);c[m?m[1]+"|"+m[3]+"|"+SL[m[2]]:k]=o.c[k]}
    o.c=c;const t={};
    for(const k in o.t){const m=k.match(/^(\d{4}-\d\d-\d\d)\|([12])$/);t[m?m[1]+"|d|"+m[2]:k]=o.t[k]}
    o.t=t;
  }
  return o;
}
try{const s=JSON.parse(localStorage.getItem("trat-v1")||"null");state=load(s)}catch(e){state=load(null)}
const saveLocal=()=>{try{localStorage.setItem("trat-v1",JSON.stringify(state))}catch(e){}};
saveLocal();
function persist(){saveLocal();if(window.TRAT&&window.TRAT.onChange)window.TRAT.onChange()}
window.TRAT={get:()=>state,set:s=>{state=load(Object.assign({v:2},s));saveLocal();render()},onChange:null};

// ---------- schedule ----------
const medStart=m=>parseISO(m.start);
const medEnd=m=>addD(medStart(m),Math.max(1,m.days)-1);
function range(){
  if(!state.meds.length)return null;
  let a=medStart(state.meds[0]),b=medEnd(state.meds[0]);
  for(const m of state.meds){if(medStart(m)<a)a=medStart(m);if(medEnd(m)>b)b=medEnd(m)}
  return{a,n:dayDiff(a,b)+1};
}
const startFor=key=>state.t[key]?toMin(state.t[key]):DEFAULT_START;
function medTimes(m,key){
  const out=[startFor(key)],per=Math.max(1,Math.round(24/m.every));
  for(let j=1;j<per;j++){const o=state.t[key+"|"+m.id+"|"+j];out.push(o!=null?+o:out[j-1]+m.every*60)}
  return out;
}
const activeOn=(m,d)=>d>=medStart(m)&&d<=medEnd(m);
// rows of a day: one per distinct time, each with the doses due then
function rowsFor(d){
  const key=iso(d),map=new Map();
  state.meds.forEach(m=>{if(!activeOn(m,d))return;
    medTimes(m,key).forEach((tm,j)=>{if(!map.has(tm))map.set(tm,[]);map.get(tm).push({m,j})})});
  return [...map.entries()].sort((x,y)=>x[0]-y[0]).map(([time,items])=>({time,items}));
}
const ckey=(key,m,j)=>key+"|"+m.id+"|"+j;
function dayStatus(d){const key=iso(d);let t=0,n=0;
  for(const r of rowsFor(d))for(const x of r.items){t++;if(state.c[ckey(key,x.m,x.j)])n++}
  return n===0?"":n===t?"full":"part"}
function warnFor(d){
  const key=iso(d),pk=iso(addD(d,-1));
  for(const m of state.meds){
    if(!activeOn(m,d)||!activeOn(m,addD(d,-1)))continue;
    const prev=medTimes(m,pk),gap=startFor(key)+1440-prev[prev.length-1];
    if(gap<m.every*60*0.75)return`Solo ${Math.max(0,Math.round(gap/60))} h desde la última ${esc(m.n)}`;
  }
  return"";
}

// ---------- views ----------
const today=new Date();today.setHours(0,0,0,0);
let sel=today;
const VIEWS={horario:"Horario",medicamentos:"Medicamentos","mi-id":"Mi ID"};
const viewFromHash=()=>{const h=location.hash.slice(1);return VIEWS[h]?h:"horario"};
let view=viewFromHash();
function clampSel(){const r=range();if(!r)return;const last=addD(r.a,r.n-1);if(sel<r.a)sel=r.a;if(sel>last)sel=last}
clampSel();

function renderStrip(){
  const r=range();if(!r){$("strip").innerHTML="";return}
  let h="";
  for(let i=0;i<r.n;i++){const d=addD(r.a,i);
    const mon=(i===0||d.getDate()===1)?`<span class="m">${MESES[d.getMonth()]}</span>`:"";
    const isSel=iso(d)===iso(sel),isT=iso(d)===iso(today);
    h+=`<button class="day ${dayStatus(d)}${isT?" today":""}" role="tab" id="day-${iso(d)}" data-d="${iso(d)}" aria-selected="${isSel}" aria-label="${DIASL[d.getDay()]} ${d.getDate()} de ${MESESL[d.getMonth()]}">${mon}<span class="w">${DIAS[d.getDay()]}</span><span class="n">${d.getDate()}</span><span class="s"></span></button>`}
  $("strip").innerHTML=h;
}
function renderDay(){
  const r=range();
  if(!r){$("dhead").hidden=true;$("ends").hidden=true;
    $("times").innerHTML=`<div class="empty"><p>Aún no tienes medicamentos.</p><button class="btn" data-go="medicamentos">Agregar medicamento</button></div>`;return}
  $("dhead").hidden=false;$("ends").hidden=false;
  const d=sel,key=iso(d),warn=warnFor(d),rows=rowsFor(d);
  $("dtitle").textContent=(iso(d)===iso(today)?"Hoy · ":"")+DIASL[d.getDay()]+" "+d.getDate()+" de "+MESESL[d.getMonth()];
  $("calDay").innerHTML=calIcon(d.getDate())+'<span class="lbl">Agregar día</span>';
  $("calDay").hidden=!rows.length;
  if(!rows.length){$("times").innerHTML=`<div class="empty"><p>Este día no tiene tomas.</p></div>`;placeHand();return}
  $("times").innerHTML=rows.map((x,j)=>{const p=p12(x.time),nd=nextDayLbl(x.time);
    const lab=`<button class="t ed" data-edit="${j}" aria-label="Cambiar la hora de las ${fmt12(x.time)}"><span class="v">${p.t}</span><span class="ap">${p.ap}</span>${PEN}${nd?`<span class="sub">${nd}</span>`:""}</button>`;
    return `<div class="time"><div class="tc">${lab}<button class="cal" data-slot="${j}" aria-label="Agregar la toma de las ${fmt12(x.time)} a mi calendario">${calIcon(d.getDate())}</button></div><div class="items">`+
      x.items.map(({m,j:k})=>{const id=ckey(key,m,k),on=!!state.c[id];
        return `<button class="it${on?" on":""}" data-k="${id}" aria-pressed="${on}" style="--c:var(${COLORS[m.col%COLORS.length]})"><span class="b">${CHECK}</span><span class="l">${esc(m.n)}${m.note?`<small>${esc(m.note)}</small>`:""}</span></button>`}).join("")+
      `${j===0&&warn?`<p class="warn">${warn}</p>`:""}</div></div>`}).join("");
  placeHand();
}
function renderEnds(){
  $("ends").innerHTML=state.meds.map(m=>`<div class="end"><i style="background:var(${COLORS[m.col%COLORS.length]})"></i>${esc(m.n)}<span>hasta ${fmtDate(medEnd(m))}</span></div>`).join("");
}
function renderMeds(){
  $("mlist").innerHTML=state.meds.length?state.meds.map((m,i)=>`<button class="mrow" data-med="${i}"><i style="background:var(${COLORS[m.col%COLORS.length]})"></i><span class="tx"><b>${esc(m.n)}</b><span class="sub">Cada ${m.every} h · ${m.days} ${m.days===1?"día":"días"} · desde ${fmtDate(medStart(m))}</span></span>${CHEV}</button>`).join("")
    :`<div class="empty"><p>Aún no tienes medicamentos.</p></div>`;
}
function render(){
  clampSel();
  $("vH").hidden=view!=="horario";$("vM").hidden=view!=="medicamentos";$("vI").hidden=view!=="mi-id";
  $("vTitle").textContent=VIEWS[view];
  document.querySelectorAll(".mnav [data-view]").forEach(b=>{if(b.dataset.view===view)b.setAttribute("aria-current","page");else b.removeAttribute("aria-current")});
  if(view==="horario"){renderStrip();renderDay();renderEnds()}
  else{if(view==="medicamentos")renderMeds();if(handEl){handEl.remove();handEl=null}}
  if(window.TRAT&&window.TRAT.onView)window.TRAT.onView(view);
}
function go(v){view=v;closeMenu();try{history.replaceState(null,"",v==="horario"?location.pathname:"#"+v)}catch(e){}render();window.scrollTo(0,0);
  if(v==="horario")requestAnimationFrame(scrollSel)}
function scrollSel(){const b=$("day-"+iso(sel));if(b&&b.scrollIntoView)b.scrollIntoView({inline:"center",block:"nearest"})}
window.addEventListener("hashchange",()=>{view=viewFromHash();render()});
// side menu
function paintBar(){const c=getComputedStyle(document.body).backgroundColor;document.querySelectorAll('meta[name="theme-color"]').forEach(m=>m.setAttribute("content",c))}
paintBar();try{matchMedia("(prefers-color-scheme: dark)").addEventListener("change",()=>requestAnimationFrame(paintBar))}catch(e){}
function openMenu(){$("menu").classList.add("open");$("scrim").hidden=false;$("menuBtn").setAttribute("aria-expanded","true")}
function closeMenu(){$("menu").classList.remove("open");$("scrim").hidden=true;paintBar();$("menuBtn").setAttribute("aria-expanded","false")}
$("menuBtn").addEventListener("click",openMenu);
$("scrim").addEventListener("click",closeMenu);
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeMenu()});

// ---------- time picker (12 h, AM/PM): closes only with Listo or Cancelar ----------
const HOURS=[];for(let h=1;h<=12;h++)HOURS.push(h);
const MINS=[];for(let m=0;m<60;m+=5)MINS.push(m);
const APS=["AM","PM"];
const IH=44;let editRow=0;
function fillWheel(el,arr,pad){el.innerHTML=arr.map(v=>`<div>${pad?String(v).padStart(2,"0"):v}</div>`).join("")}
fillWheel($("wH"),HOURS,false);fillWheel($("wM"),MINS,true);fillWheel($("wA"),APS,false);
const idxOf=el=>Math.max(0,Math.min(el.children.length-1,Math.round(el.scrollTop/IH)));
function pickVal(){const h=HOURS[idxOf($("wH"))]%12+(idxOf($("wA"))?12:0);return h*60+MINS[idxOf($("wM"))]}
// first time of the day moves everything; a later time moves the doses after it (same interval)
function applyPick(t,v){
  const key=iso(sel),row=rowsFor(sel)[editRow];if(!row)return;
  const saved=state.t;state.t=t;
  try{
    if(row.items.some(x=>x.j===0)){t[key]=toHH(v);for(const k of Object.keys(t))if(k.startsWith(key+"|"))delete t[k];return}
    for(const {m,j} of row.items){
      const prev=medTimes(m,key)[j-1];let w=v;while(w<=prev)w+=1440;
      t[key+"|"+m.id+"|"+j]=w;
      for(let q=j+1;q<24;q++)delete t[key+"|"+m.id+"|"+q];
    }
  }finally{state.t=saved}
}
let rafP=0;
function onWheel(){cancelAnimationFrame(rafP);rafP=requestAnimationFrame(()=>{
  for(const el of [$("wH"),$("wM"),$("wA")]){const i=idxOf(el);[...el.children].forEach((c,j)=>c.classList.toggle("cur",j===i))}
  const saved=state.t,tmp=Object.assign({},saved);applyPick(tmp,pickVal());state.t=tmp;
  const rows=rowsFor(sel);state.t=saved;
  $("shPrev").textContent=rows.map(r=>fmt12(r.time)).join(" · ");
})}
for(const id of ["wH","wM","wA"])$(id).addEventListener("scroll",onWheel,{passive:true});
function openPicker(j){
  editRow=j;const x=rowsFor(sel)[j];if(!x)return;
  const r=((x.time%1440)+1440)%1440,h=Math.floor(r/60);
  openSheet("sheetBg");
  requestAnimationFrame(()=>{
    $("wH").scrollTop=Math.max(0,HOURS.indexOf(h%12||12))*IH;
    $("wM").scrollTop=Math.max(0,MINS.indexOf(Math.floor((r%60)/5)*5))*IH;
    $("wA").scrollTop=(h<12?0:1)*IH;onWheel()});
}
function openSheet(id){$(id).hidden=false;document.body.style.overflow="hidden"}
function closeSheet(id){$(id).hidden=true;document.body.style.overflow=""}
$("shCancel").addEventListener("click",()=>closeSheet("sheetBg"));
$("shOk").addEventListener("click",()=>{applyPick(state.t,pickVal());closeSheet("sheetBg");persist();render()});

// ---------- medicines form ----------
let fmIdx=-1,fm={every:24,days:7,col:0},delArmed=false;
$("fmEvery").innerHTML=EVERY.map(h=>`<button type="button" data-e="${h}" aria-pressed="false">${h} h</button>`).join("");
$("fmCol").innerHTML=COLORS.map((c,i)=>`<button type="button" data-c="${i}" aria-pressed="false" aria-label="Color ${i+1}" style="background:var(${c})"></button>`).join("");
function paintForm(){
  [...$("fmEvery").children].forEach(b=>b.setAttribute("aria-pressed",+b.dataset.e===fm.every));
  [...$("fmCol").children].forEach(b=>b.setAttribute("aria-pressed",+b.dataset.c===fm.col));
  $("fmDays").textContent=fm.days+(fm.days===1?" día":" días");
}
function openMed(i){
  fmIdx=i;delArmed=false;const m=i>=0?state.meds[i]:null;
  const used=new Set(state.meds.map(x=>x.col));
  fm={every:m?m.every:24,days:m?m.days:7,col:m?m.col:(COLORS.findIndex((_,k)=>!used.has(k))+1||state.meds.length%COLORS.length+1)-1};
  if(fm.col<0)fm.col=0;
  $("fmTitle").textContent=m?"Editar medicamento":"Nuevo medicamento";
  $("fmName").value=m?m.n:"";$("fmNote").value=m?m.note||"":"";$("fmStart").value=m?m.start:iso(today);
  $("fmErr").textContent="";$("fmDel").hidden=!m;$("fmDel").textContent="Eliminar medicamento";
  paintForm();openSheet("medBg");
}
$("fmEvery").addEventListener("click",e=>{const b=e.target.closest("[data-e]");if(b){fm.every=+b.dataset.e;paintForm()}});
$("fmCol").addEventListener("click",e=>{const b=e.target.closest("[data-c]");if(b){fm.col=+b.dataset.c;paintForm()}});
$("dMinus").addEventListener("click",()=>{fm.days=Math.max(1,fm.days-1);paintForm()});
$("dPlus").addEventListener("click",()=>{fm.days=Math.min(365,fm.days+1);paintForm()});
$("fmCancel").addEventListener("click",()=>closeSheet("medBg"));
$("fm").addEventListener("submit",e=>{e.preventDefault();saveMed()});
$("fmOk").addEventListener("click",saveMed);
function saveMed(){
  const n=$("fmName").value.trim(),st=$("fmStart").value;
  if(!n){$("fmErr").textContent="Escribe el nombre del medicamento.";$("fmName").focus();return}
  if(!/^\d{4}-\d\d-\d\d$/.test(st)){$("fmErr").textContent="Elige la fecha en que empieza.";return}
  const data={n,every:fm.every,days:fm.days,start:st,note:$("fmNote").value.trim(),col:fm.col};
  if(fmIdx>=0)Object.assign(state.meds[fmIdx],data);
  else state.meds.push(Object.assign({id:"m"+Date.now().toString(36)},data));
  closeSheet("medBg");persist();render();toast(fmIdx>=0?"Medicamento actualizado":"Medicamento agregado");
}
$("fmDel").addEventListener("click",()=>{
  if(!delArmed){delArmed=true;$("fmDel").textContent="Toca otra vez para eliminar";return}
  state.meds.splice(fmIdx,1);closeSheet("medBg");persist();render();toast("Medicamento eliminado");
});

// ---------- taps ----------
document.addEventListener("click",e=>{
  const tb=e.target.closest(".mnav [data-view]");if(tb){go(tb.dataset.view);return}
  const g=e.target.closest("[data-go]");if(g){newSeen=true;try{localStorage.setItem("trat-tuto-new","1")}catch(_){}go(g.dataset.go);if(g.dataset.go==="medicamentos")openMed(-1);return}
  const dy=e.target.closest(".day");if(dy){sel=parseISO(dy.dataset.d);render();return}
  const ed=e.target.closest("[data-edit]");if(ed){openPicker(+ed.dataset.edit);return}
  if(e.target.closest("#calDay")){addToCalendar(null);return}
  const cb=e.target.closest(".cal[data-slot]");if(cb){addToCalendar(+cb.dataset.slot);return}
  const mr=e.target.closest("[data-med]");if(mr){openMed(+mr.dataset.med);return}
  if(e.target.closest("#addMed")){openMed(-1);return}
  const it=e.target.closest(".it");if(it){const k=it.dataset.k;
    if(state.c[k])delete state.c[k];else state.c[k]=true;
    hideHand();persist();render()}
});

// ---------- calendar (.ics works on iPhone, iPad, Mac and Android) ----------
const PLUS='<svg viewBox="0 0 10 10" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><path d="M5 2v6M2 5h6"/></svg>';
const calIcon=n=>`<span class="ciw" aria-hidden="true"><span class="ci"><span class="ci-top"></span><span class="ci-n">${n}</span></span><span class="ci-plus">${PLUS}</span></span>`;
function icsTime(d,min){const x=new Date(d);x.setHours(0,min,0,0);
  const p=n=>String(n).padStart(2,"0");return x.getFullYear()+p(x.getMonth()+1)+p(x.getDate())+"T"+p(x.getHours())+p(x.getMinutes())+"00"}
const icsEsc=s=>String(s).replace(/[\\;,]/g,c=>"\\"+c);
function addToCalendar(slot){
  const d=sel,rows=rowsFor(d).map((x,j)=>({x,j})).filter(o=>slot===null||o.j===slot);
  if(!rows.length)return;
  const stamp=new Date().toISOString().replace(/[-:]/g,"").replace(/\.\d+Z$/,"Z");
  const ev=rows.map(({x,j})=>{const names=x.items.map(o=>icsEsc(o.m.n));
    return ["BEGIN:VEVENT","UID:"+iso(d)+"-"+j+"-"+icsTime(d,x.time)+"-"+Date.now()+"@la86926","DTSTAMP:"+stamp,
      "DTSTART:"+icsTime(d,x.time),"DTEND:"+icsTime(d,x.time+10),
      "SUMMARY:Tomar "+names.join(" + "),"DESCRIPTION:"+names.join("\\n"),
      "BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:Tomar "+names.join(" + "),"TRIGGER:-PT0M","END:VALARM","END:VEVENT"].join("\r\n")});
  const ics=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Mi tratamiento//ES","CALSCALE:GREGORIAN","METHOD:PUBLISH",...ev,"END:VCALENDAR"].join("\r\n");
  const blob=new Blob([ics],{type:"text/calendar;charset=utf-8"}),url=URL.createObjectURL(blob);
  const a=document.createElement("a");a.href=url;a.download="tomas-"+iso(d)+"-"+rows.map(o=>fmtMin(o.x.time).replace(":","h")).join("-")+".ics";
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);
  toast(slot===null?"Abre el archivo para agregar el día a tu calendario":"Abre el archivo para agregar la toma a tu calendario");
}
let toastT=0;function toast(t){let el=document.querySelector(".toast");if(!el){el=document.createElement("div");el.className="toast";el.setAttribute("role","status");document.body.appendChild(el)}
  el.textContent=t;el.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>{el.hidden=true},3500)}

// ---------- first-visit hint ----------
let tutoSeen=false;try{tutoSeen=localStorage.getItem("trat-tuto2")==="1"}catch(e){}
let handEl=null;
function placeHand(){
  if(handEl){handEl.remove();handEl=null}
  if(view==="horario"&&!state.meds.length&&!newSeen){const t=document.querySelector("#times [data-go]");if(t)showHand(t,"Toca para agregar tu primer medicamento");return}
  if(tutoSeen||view!=="horario")return;
  const t=document.querySelector(".it:not(.on) .b");if(!t)return;
  showHand(t,"Toca para marcar o desmarcar");
}
let newSeen=false;try{newSeen=localStorage.getItem("trat-tuto-new")==="1"}catch(e){}
function showHand(t,txt){
  const r=t.getBoundingClientRect();
  handEl=document.createElement("div");handEl.className="hand";
  handEl.innerHTML='<svg viewBox="0 0 48 48"><path d="M19 6c2 0 3.5 1.6 3.5 3.6v12.2l1.4-.4c1.7-.4 3.4.4 4 2l.2.4 1.6-.4c1.7-.4 3.4.5 4 2.1l1.8-.3c1.8-.3 3.5.9 3.8 2.7.2 1 .2 2 .1 3l-.7 6.3c-.4 3.6-3.4 6.3-7 6.3h-7.3c-2.3 0-4.4-1.1-5.8-3l-7.5-10.4c-1-1.4-.8-3.4.6-4.4 1.3-1 3.1-.9 4.3.2l1.4 1.3V9.6C15.5 7.6 17 6 19 6z" fill="#fff" stroke="#16202a" stroke-width="2" stroke-linejoin="round"/></svg><span>'+txt+'</span>';
  document.body.appendChild(handEl);
  handEl.style.left=(r.left+window.scrollX-6)+"px";
  handEl.style.top=(r.bottom+window.scrollY+2)+"px";
}
function hideHand(){if(tutoSeen)return;tutoSeen=true;try{localStorage.setItem("trat-tuto2","1")}catch(e){}if(handEl){handEl.remove();handEl=null}}
window.addEventListener("resize",()=>{if(!tutoSeen)placeHand()});
